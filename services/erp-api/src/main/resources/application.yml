server:
  address: ${BIND_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:true}
spring:
  application:
    name: dexlanka-manufacturing-pro
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/dexlanka}
    username: ${DATABASE_USER:dexlanka}
    password: ${DATABASE_PASSWORD:}
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true
  web:
    resources:
      add-mappings: false
app:
  demo: false
  bootstrap-password: ${BOOTSTRAP_PASSWORD:}
  bootstrap-email: ${BOOTSTRAP_EMAIL:}
  mfa:
    # V17: base64 of 32 random bytes (openssl rand -base64 32); the API refuses to start without it.
    encryption-key: ${MFA_ENCRYPTION_KEY:}
    required-for-admins: ${MFA_REQUIRED_FOR_ADMINS:true}
